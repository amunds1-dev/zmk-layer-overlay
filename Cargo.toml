[package]
name = "totem-overlay"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
async-channel = "2.5.0"
cairo-rs = { version = "0.22.11", features = ["png"] }
gdk_wayland = { version = "0.11.5", package = "gdk4-wayland" }
gio = { version = "0.22.11", features = ["v2_80"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
gtk4-layer-shell = "0.9.0"
hidapi = { version = "2.6.7", default-features = false, features = ["linux-shared-hidraw"] }
pangocairo = "0.22.9"
prost = "0.14.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }
toml = "1.2.3"
