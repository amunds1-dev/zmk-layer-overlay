[package]
name = "totem-overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
cairo-rs = { version = "0.22.11", features = ["png"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
hidapi = { version = "2.6.7", default-features = false, features = ["linux-shared-hidraw"] }
pangocairo = "0.22.9"
