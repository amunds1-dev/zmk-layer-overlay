[project]
name = "totem-overlay"
version = "0.1.0"
description = "On-screen layer overlay for a ZMK TOTEM keyboard (Linux, Wayland layer-shell)"
requires-python = ">=3.10"
# PyGObject, gtk4-layer-shell and hidapi are best installed from the distro
# (see README); they are listed here as optional so `pip install` works too.
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
pip-deps = ["PyGObject>=3.46", "hidapi>=0.14"]

[project.scripts]
totem-overlay = "totem_overlay.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["totem_overlay"]
